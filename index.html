<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>곶감이 숭배 사이트</title>
</head>
<style>
    #tit {
        font-size: 3vw;
        text-align: center;
    }

    .lizard {
        width: 20vw;
        height: auto;
    }

    #lizard2 {
        margin-top: -30%;
        margin-left: 40%;
    }

    #lizard1 {
        margin-top: 10%;
        margin-left: 8%;
    }

    #lizard3 {
        margin-top: 20%;

    }

    body,

    }

    #tk {
        font-size: 2.2vw;
        cursor: pointer;
    }

    #dd {
        font-size: 1vw;
    }

    #music {
        width: 2vw;
        height: 2vw;
        cursor: pointer;
        text-align: center;
        background-color: beige;
        animation-name: ms;
        animation-duration: 3s;
        animation-iteration-count: infinite;
        border-radius: 30%;
    }

    @keyframes ms {
        0% {
            background-color: beige;
        }

        25% {
            background-color: rgb(248, 248, 213);
        }

        50% {
            background-color: rgb(252, 252, 209);
        }

        75% {
            background-color: rgb(247, 247, 192);
        }

        100% {
            background-color: beige;
        }



    }

    #lizard4 {
        margin-left: 70%;
        margin-top: -16%;
    }

    #sp {
        font-size: 2vw;
    }

    #lizard5 {
        margin-right: 50%;


        /*사진 위치초정하기 + class되있어서 크기 조정 x*/
    }

    #fun {
        font-size: 2vw;
        cursor: pointer;
    }

    #d {
        display: none;
    }

    #close {
        cursor: pointer;
        font-size: 2vw;
    }

    #ddin {
        margin-left: 50%;
    }

    body {
        border-radius: 50%;
        border: 1px;
        background-color: beige;
        animation-name: bod;
        animation-duration: 3s;
        animation-iteration-count: infinite;


    }

    /*이거 기억하기 body에도 애니메이션 적용 가능*/

    @keyframes bod {
        0% {
            background-color: beige;
        }

        25% {
            background-color: rgb(250, 250, 216);
        }

        50% {
            background-color: rgb(248, 248, 201);
        }

        75% {
            background-color: rgb(250, 250, 195);
        }

        100% {
            background-color: rgb(250, 250, 195);
        }
    }

    #sp {
        animation-name: ss;
        animation-duration: 2s;
    }

    @keyframes ss {
        0% {
            margin-top: 2%;
        }

        25% {
            margin-top: 4%;
        }

        50% {
            margin-top: 5%;
        }

        75% {
            margin-top: 7%;
        }

        100% {
            margin-top: 8%;
        }



    }
</style>



<body>
